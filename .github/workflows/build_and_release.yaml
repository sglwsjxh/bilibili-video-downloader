name: build_and_release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build nativehost.exe
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Push-Location backend
          go build -ldflags "-s -w -X main.version=$version" -o ../installer/nativehost.exe ./cmd/nativehost/
          Pop-Location

      - name: Prepare release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $dirName = "bili-video-download-$version"
          New-Item -ItemType Directory -Path $dirName -Force

          $files = @('README.md')
          foreach ($f in $files) {
            Copy-Item $f -Destination $dirName
          }

          Copy-Item .output\chrome-mv3 -Recurse -Destination $dirName
          Copy-Item installer -Recurse -Destination $dirName

          Remove-Item (Join-Path $dirName 'installer\config.json') -ErrorAction SilentlyContinue

          Compress-Archive -Path $dirName -DestinationPath "$dirName.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: bili-video-download-*.zip
          generate_release_notes: true
